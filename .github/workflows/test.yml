name: Test

on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Shanghai, UTC]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Upstream reuse targets
        run: python3 scripts/check_upstream.py
      - name: Unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:testDebugUnitTest
