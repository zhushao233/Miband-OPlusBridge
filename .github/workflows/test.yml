name: Test
run-name: Test · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Shanghai, UTC]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Upstream reuse targets
        run: python3 scripts/check_upstream.py
      - name: Unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:testDebugUnitTest

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: Asia/Shanghai
      PROJECT_KEYSTORE_BASE64: ${{ secrets.OPLUSBAND_KEYSTORE_BASE64 }}
      PROJECT_STORE_PASSWORD: ${{ secrets.OPLUSBAND_STORE_PASSWORD }}
      PROJECT_KEY_ALIAS: ${{ secrets.OPLUSBAND_KEY_ALIAS }}
      PROJECT_KEY_PASSWORD: ${{ secrets.OPLUSBAND_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: "A9:B2:A9:BD:1D:F2:8D:E3:CE:1F:32:99:B0:F8:B6:62:B8:47:2C:E6:61:DA:21:02:A9:71:BD:57:AB:C8:86:E9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare signing
        run: |
          set -euo pipefail
          if [[ -z "${PROJECT_KEYSTORE_BASE64:-}" || -z "${PROJECT_STORE_PASSWORD:-}" \
                || -z "${PROJECT_KEY_ALIAS:-}" || -z "${PROJECT_KEY_PASSWORD:-}" ]]; then
            echo "::error::Signing secrets are missing. Configure OPLUSBAND_KEYSTORE_BASE64, OPLUSBAND_STORE_PASSWORD, OPLUSBAND_KEY_ALIAS, and OPLUSBAND_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$PROJECT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/project-signing.jks"
          test -s "$RUNNER_TEMP/project-signing.jks"
          echo "OPLUSBAND_KEYSTORE=$RUNNER_TEMP/project-signing.jks" >> "$GITHUB_ENV"
          echo "OPLUSBAND_STORE_PASSWORD=$PROJECT_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OPLUSBAND_KEY_ALIAS=$PROJECT_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OPLUSBAND_KEY_PASSWORD=$PROJECT_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_SOURCE=repository-secrets" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          echo "APK signing source: $SIGNING_SOURCE"
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Stage APK and checksum
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          APK="build-artifacts/Miband-OPlusBridge-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          CERT_SHA256="$(
            keytool -list -v \
              -keystore "$OPLUSBAND_KEYSTORE" \
              -storepass "$OPLUSBAND_STORE_PASSWORD" \
              -alias "$OPLUSBAND_KEY_ALIAS" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -n 1
          )"
          if [[ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate changed. Expected $EXPECTED_CERT_SHA256, got $CERT_SHA256"
            exit 1
          fi
          {
            echo "source=$SIGNING_SOURCE"
            echo " SHA256: $CERT_SHA256"
          } > build-artifacts/signing.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miband-OPlusBridge-debug-${{ github.sha }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
