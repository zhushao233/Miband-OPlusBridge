name: Test
run-name: Test · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Shanghai, UTC]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Upstream reuse targets
        run: python3 scripts/check_upstream.py
      - name: Unit tests
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:testDebugUnitTest

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare CI debug signing
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          echo "OPLUSBAND_KEYSTORE=$RUNNER_TEMP/ci-debug.jks" >> "$GITHUB_ENV"
          echo "OPLUSBAND_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "OPLUSBAND_KEY_ALIAS=ci-debug" >> "$GITHUB_ENV"
          echo "OPLUSBAND_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias ci-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname CN=CiDebug \
            -noprompt
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:assembleDebug
      - name: Stage APK and checksum
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          APK="build-artifacts/Miband-OPlusBridge-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miband-OPlusBridge-debug-${{ github.sha }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
